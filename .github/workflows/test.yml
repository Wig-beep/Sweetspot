name: Test

on: [push, workflow_dispatch]

jobs:
  build:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # install exactly the versions in package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      # end-to-end tests of the production build (desktop and phone)
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      # the build for clearly educational use, without the learner's own data
      - run: npm run build
        env:
          SWEETSPOT_PERSONAL_DATA: 'off'
      - run: npx playwright test
        env:
          SWEETSPOT_PERSONAL_DATA: 'off'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
