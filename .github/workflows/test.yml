name: Test

on: [push, workflow_dispatch]

jobs:
  build:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # install exactly the versions in package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
